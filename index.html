<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Arshhi – Door to door beauty care</title><meta name="description" content="Arshhi brings beauty care services to your home in Kolkata, West Bengal.">
<link rel="icon" type="image/png" href="Arshhi_fab.png">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<noscript><style>.rv{opacity:1!important;transform:none!important}</style></noscript>
<style id="css">:root{--bg:#faf6f1;--blush:#efe5d8;--card:#fffefb;--ink:#2c1e14;--soft:#6b574a;--bronze:#8b5e3c;--bronze-d:#6b4423;--rose:#c4a484;--line:#e6d9c8;--shadow:0 18px 50px rgba(90,52,30,.14);--ease:cubic-bezier(.2,.7,.2,1);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Jost,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--blush:#241c15;--card:#2a2119;--ink:#f5ebe1;--soft:#cbb9a8;--bronze:#c9a06a;--bronze-d:#d4b48a;--line:#3d3026;--shadow:0 18px 50px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#1a1410;--blush:#241c15;--card:#2a2119;--ink:#f5ebe1;--soft:#cbb9a8;--bronze:#c9a06a;--bronze-d:#d4b48a;--line:#3d3026;--shadow:0 18px 50px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--bronze);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h2{font-size:clamp(38px,6vw,56px);letter-spacing:-.5px;margin-bottom:14px}
h2::after{content:"";display:block;width:64px;height:3px;background:linear-gradient(90deg,var(--bronze),var(--rose));margin-top:16px;border-radius:2px;transform-origin:left;transition:transform 1s var(--ease) .2s}
.rv:not(.in) h2::after,h2.rv:not(.in)::after{transform:scaleX(0)}
.lead{color:var(--soft);max-width:54ch;margin:0 0 48px;font-size:18px}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:inherit;font-size:inherit;background:transparent;position:relative;display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:500;border:2px solid var(--bronze);min-height:50px;overflow:hidden;isolation:isolate;transition:transform .35s var(--ease),box-shadow .35s var(--ease),color .35s,background .35s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bronze-d);transform:translateY(101%);transition:transform .4s var(--ease)}
.btn.main{background:var(--bronze);color:#fff}
.btn.alt{color:var(--bronze)}
.btn.alt::before{background:var(--bronze)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(139,94,60,.3)}
.btn:hover::before{transform:none}
.btn.alt:hover{color:#fff}
.btn:active{transform:translateY(0)}

/* top bar + nav */
.topbar{background:var(--bronze-d);color:#fff;font-size:14px}
:root[data-theme="dark"] .topbar,.topbar{color:#fff}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.topbar a{text-decoration:none;font-weight:500;transition:opacity .3s}
.topbar a:hover{opacity:.75}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
.nav.scrolled{border-color:var(--line);box-shadow:0 8px 28px rgba(90,52,30,.08)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;transition:height .4s var(--ease)}
.nav.scrolled .wrap{height:60px}
.brand{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--bronze);text-decoration:none;letter-spacing:.5px;transition:transform .4s var(--ease)}
.brand:hover{transform:scale(1.04)}
.nav ul{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.nav li a:not(.btn){position:relative;text-decoration:none;font-weight:500;padding:8px 2px}
.nav li a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--rose);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.nav li a:not(.btn):hover::after,.nav li a[aria-current="true"]::after{transform:scaleX(1);transform-origin:left}
.nav .btn{padding:8px 22px;min-height:42px;color:#fff;font-size:16px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blush) 0%,var(--bg) 70%);padding:48px 0 56px;border-bottom:1px solid var(--line)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero::before{width:380px;height:380px;right:-120px;top:-120px;background:radial-gradient(circle,rgba(196,164,132,.35),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
.hero::after{width:300px;height:300px;left:-100px;bottom:-140px;background:radial-gradient(circle,rgba(139,94,60,.2),transparent 70%);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.15)}}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:56px;align-items:center}
.plate{order:2;position:relative;display:inline-block;background:#fff;border-radius:32px;padding:12px;max-width:100%;box-shadow:var(--shadow);animation:float 7s ease-in-out infinite}
.plate::before{content:"";position:absolute;inset:-14px;border:1.5px solid var(--rose);border-radius:42px;opacity:.7;transform:rotate(-3deg);transition:transform .8s var(--ease)}
.plate:hover::before{transform:rotate(3deg)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.plate img{display:block;width:min(250px,64vw);height:auto;border-radius:22px}
.hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-1px;margin:0 0 16px;max-width:15ch}
.hero p{margin:0 0 30px;max-width:46ch;color:var(--soft);font-size:19px}
.hero .btns{justify-content:flex-start}
.hero-text>*{animation:slideIn 1s var(--ease) both}
.hero-text>p{animation-delay:.2s}
.hero-text>.btns{animation-delay:.4s}
.hero-text>.fbtn{animation-delay:.6s}
.plate{animation:slideIn 1s var(--ease) both,float 7s ease-in-out 1s infinite}
@keyframes slideIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.fbtn{margin-top:16px;background:none;border:0;padding:0;font:inherit;font-weight:500;color:var(--bronze);cursor:pointer;min-height:44px;display:block;background-image:linear-gradient(var(--rose),var(--rose));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat;width:max-content;transition:background-size .4s var(--ease),color .3s}
.fbtn:hover{background-size:0 2px;color:var(--bronze-d)}

.hero{min-height:clamp(430px,64vh,580px);display:flex;flex-direction:column;justify-content:center}
.hero{min-height:clamp(340px,50vh,460px);display:flex;flex-direction:column;justify-content:center}
.hero>.wrap{width:100%}
.facts{background:var(--bg);border-bottom:1px solid var(--line)}
.facts .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;padding-top:22px;padding-bottom:22px;color:var(--soft);font-size:16px;text-align:center}
.facts .wrap>div{padding:6px 16px;border-left:1px solid var(--line)}
.facts .wrap>div:first-child{border-left:0}
.facts b{color:var(--ink);font-weight:600;font-size:18px}

/* services */
.services{background:var(--bg)}
.filters{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 16px;margin:0 0 28px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-weight:500;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 20px;min-height:44px;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .4s var(--ease)}
.chip:hover{border-color:var(--bronze);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:#fff}
.services ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.services li{display:block}
.services li[hidden]{display:none}
.services li.pop{animation:pop .55s var(--ease) both}
.card{position:relative;display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--rose)}
.card.sel{border-color:var(--bronze);box-shadow:0 0 0 2px var(--bronze)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--bronze),var(--rose));transform:scaleX(.18);transform-origin:left;transition:transform .7s var(--ease)}
.card:hover::before,.card.sel::before{transform:scaleX(1)}
.cb{display:flex;flex-direction:column;gap:6px;padding:26px 22px 22px;flex:1}
.tag{align-self:flex-start;font-size:13px;color:var(--bronze);background:var(--blush);border-radius:999px;padding:2px 12px}
.card h3{font-size:26px;color:var(--ink)}
.price{margin:0;font-weight:600;color:var(--bronze)}
.cb .sum{margin:0;color:var(--soft);font-size:15px;line-height:1.5;flex:1}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{flex:1;white-space:nowrap;padding:9px 8px;min-height:44px;font-size:14.5px;cursor:pointer;font-family:inherit}
.acts .add[aria-pressed="true"]{background:#fff;color:var(--bronze);}
.acts .add[aria-pressed="true"]::before{background:var(--blush)}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:40px 0}

/* selection bar */
.cart{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:16;width:min(720px,calc(100% - 24px));transform:translate(-50%,160%);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px 12px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35);transition:transform .6s var(--ease)}
.cart.show{transform:translate(-50%,0)}
.cart .ci{flex:1;min-width:150px;line-height:1.3}
.cart .ci b{font-size:17px}
.cart .ci small{display:block;opacity:.75;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.cart .tot{font-family:var(--serif);font-size:26px;font-weight:700}
.cart .btn{padding:9px 20px;min-height:44px;background:var(--bronze);color:#fff;border-color:var(--bronze)}
.cart .clr{all:unset;cursor:pointer;font-size:14px;opacity:.8;padding:8px 6px;text-decoration:underline;text-underline-offset:3px}
.cart .clr:hover{opacity:1}
.cart .clr:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* how */
.how{background:var(--blush)}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:36px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s;position:relative}
.how li{counter-increment:s;position:relative;padding-top:78px}
.how li::before{content:counter(s);position:absolute;top:0;left:0;width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--rose);display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;color:var(--bronze);transition:background .4s,color .4s,transform .5s var(--ease)}
.how li:hover::before{background:var(--bronze);color:#fff;transform:scale(1.1) rotate(-6deg)}
.how li::after{content:"";position:absolute;top:28px;left:70px;right:-22px;height:2px;background:repeating-linear-gradient(90deg,var(--rose) 0 8px,transparent 8px 16px);transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease) calc(var(--d,0s) + .5s)}
.how li.in::after{transform:scaleX(1)}
.how li:last-child::after{display:none}
.how h3{font-size:30px;margin-bottom:8px}
.how p{margin:0;color:var(--soft)}

/* reviews */
.hero .reviews{position:relative;z-index:1;margin-top:56px}
.rh{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 18px}
.rgrid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.rc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--rose);padding:18px 22px;border-radius:0 16px 16px 0;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.rc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.stars{color:var(--bronze);letter-spacing:3px;font-size:18px}
.rc p{margin:6px 0 10px;color:var(--ink);font-size:16px}
.rc b{color:var(--soft);font-weight:500;font-size:15px}

/* intro + why */
.intro{background:var(--blush)}
.introg{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.introg p{margin:0 0 16px;color:var(--soft);max-width:56ch}
.why{display:grid;gap:18px}
.why div{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:0 16px 16px 0;padding:18px 22px;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.why div:hover{transform:translateX(6px);box-shadow:var(--shadow)}
.why b{display:block;font-family:var(--serif);font-size:24px;color:var(--bronze);margin-bottom:2px}
.why span{color:var(--soft)}

/* service guide */
.guide{background:var(--bg)}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:20px 56px}
.gl article{padding:22px 0;border-top:1px solid var(--line)}
.gl h3{font-size:28px;color:var(--bronze);margin-bottom:6px}
.gl p{margin:0 0 8px;color:var(--soft)}
.gl ul{margin:0;padding-left:20px;color:var(--soft)}

/* faq */
.faq{background:var(--blush)}
.fq{max-width:820px}
.fq details{background:var(--bg);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .4s,box-shadow .4s}
.fq details[open]{border-color:var(--rose);box-shadow:var(--shadow)}
.fq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;font-weight:600;min-height:56px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border:1.5px solid var(--bronze);border-radius:50%;color:var(--bronze);font-size:20px;line-height:1;transition:transform .5s var(--ease),background .3s,color .3s}
.fq details[open] summary::after{transform:rotate(135deg);background:var(--bronze);color:#fff}
.fq summary:focus-visible{outline:3px solid var(--bronze);outline-offset:-3px}
.fq .ans{padding:0 22px 20px}
.fq .ans p{margin:0;color:var(--soft)}
.fq details[open] .ans{animation:slideDown .5s var(--ease)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* contact */
.contact{background:var(--bg)}
.cgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:stretch}
.contact dl{margin:0;background:var(--blush);border:1px solid var(--line);border-radius:22px;padding:34px 36px;display:grid;grid-template-columns:max-content 1fr;gap:18px 32px;align-content:start}
.contact dt{color:var(--soft)}
.contact dd{margin:0;font-weight:500}
.contact a.tel{font-family:var(--serif);font-size:38px;line-height:1;font-weight:700;color:var(--bronze);text-decoration:none;transition:color .3s}
.contact a.tel:hover{color:var(--bronze-d)}
.book{display:flex;flex-direction:column;justify-content:center;gap:14px;border-radius:22px;padding:34px 32px;color:#fff;background:linear-gradient(145deg,var(--bronze) 0%,#5a3818 100%);box-shadow:var(--shadow)}
.book h3{font-size:36px}
.book p{margin:0 0 6px;opacity:.92}
.book .btn{border-color:#fff;color:#fff;background:transparent}
.book .btn.main{background:#fff;color:var(--bronze-d)}
.book .btn::before{background:rgba(255,255,255,.2)}
.book .btn.main::before{background:var(--blush)}
.book .btn:hover{color:inherit;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.book .btn.alt:hover{color:#fff}
.book .btns{flex-direction:column}

/* footer */
footer{background:var(--blush);border-top:1px solid var(--line);padding:64px 0 96px;color:var(--soft);font-size:16px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:40px}
.fgrid h4{margin:0 0 12px;font-family:var(--serif);font-size:24px;color:var(--ink)}
.fgrid a{display:grid
         ;text-decoration:none;margin-bottom:6px;transition:color .3s,transform .35s var(--ease)}
.fgrid a:hover{color:var(--bronze);transform:translateX(4px)}
.fgrid p{margin:0}
.fbrand{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--bronze);margin-bottom:8px}
.fsoc{display:flex;gap:10px;margin-top:16px}
.fgrid .fsoc a{margin:0;transform:none}
.sico{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--bronze);color:var(--bronze);transition:background .35s,color .35s,transform .45s var(--ease)}
.sico svg{width:20px;height:20px;fill:currentColor}
.sico:hover,.fgrid .sico:hover{background:var(--bronze);color:#fff;transform:translateY(-4px)}
.copy{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}

/* mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock .btn{flex:1;text-align:center;padding:12px 10px}

/* social side panel */
.social{position:fixed;right:0;top:50%;z-index:14;transform:translateY(-50%);display:flex;flex-direction:column;align-items:stretch;background:var(--bronze);border-radius:16px 0 0 16px;box-shadow:-6px 8px 26px rgba(90,52,30,.28);overflow:hidden;transition:box-shadow .4s}
.stab{all:unset;box-sizing:border-box;display:grid;place-items:center;width:46px;height:50px;cursor:pointer;color:#fff;transition:background .3s}
.stab:hover{background:var(--bronze-d)}
.stab:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.stab svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.social.open .stab svg{transform:rotate(180deg)}
.slinks{display:flex;flex-direction:column;max-height:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-height .6s var(--ease),opacity .4s}
.social.open .slinks{max-height:200px;opacity:1;pointer-events:auto}
.slinks a{display:grid;place-items:center;width:46px;height:46px;color:#fff;border-top:1px solid rgba(255,255,255,.22);transform:translateX(20px);opacity:0;transition:background .3s,transform .5s var(--ease),opacity .4s}
.slinks a svg{width:20px;height:20px;fill:currentColor}
.social.open .slinks a{transform:none;opacity:1}
.social.open .slinks a:nth-child(1){transition-delay:.05s}
.social.open .slinks a:nth-child(2){transition-delay:.12s}
.social.open .slinks a:nth-child(3){transition-delay:.19s}
.slinks a:hover{background:var(--bronze-d)}
.slinks a:focus-visible{outline:3px solid #fff;outline-offset:-5px}

/* modal */
.modal{border:0;border-radius:24px;padding:0;width:min(560px,calc(100% - 28px));max-height:90vh;overflow:auto;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal[open]{animation:pop .5s var(--ease)}
.modal[open]::backdrop{animation:fade .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal::backdrop{background:rgba(40,25,18,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mbody{padding:30px 30px 28px}
.modal h3{font-size:40px;color:var(--bronze);margin-bottom:8px;padding-right:44px}
.modal p{margin:0 0 16px;color:var(--soft)}
.modal h4{margin:0 0 6px;font-family:var(--serif);font-size:24px}
.modal ul{margin:0 0 18px;padding-left:20px}
.modal li{margin-bottom:4px}
.modal .note{font-size:15px;border-top:1px solid var(--line);padding-top:14px}
.modal .x{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:var(--blush);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .45s var(--ease),background .3s,color .3s}
.modal .x:hover{transform:rotate(90deg);background:var(--bronze);color:#fff}
.modal .btns{justify-content:flex-start}
#mList li{opacity:0;transform:translateX(-14px);animation:slideLeft .6s var(--ease) forwards}
@keyframes slideLeft{to{opacity:1;transform:none}}
body.lock{overflow:hidden}

/* forms + feedback */
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:15px;color:var(--soft);margin-bottom:4px}
.f input,.f textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .3s,box-shadow .3s}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--bronze);box-shadow:0 0 0 4px rgba(139,94,60,.18)}
.rate{display:flex;gap:6px;margin:0 0 14px}
.rate button{font-size:34px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px;transition:color .25s,transform .35s var(--ease)}
.rate button:hover{transform:scale(1.25) rotate(-8deg)}
.rate button.on{color:var(--bronze)}
#fbMsg{display:block;margin-top:10px;color:var(--soft);font-size:15px}

/* admin panel hooks (kept so the existing admin UI keeps working) */
.aopen{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .35s var(--ease)}
.aopen:hover{transform:translateY(-3px)}
.aopen[hidden]{display:none}
#adm{width:min(760px,calc(100% - 24px));max-height:92vh;overflow:auto}
#adm fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:14px 16px}
#adm legend{font-weight:700;color:var(--bronze);padding:0 6px;font-size:18px}
.item{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.sm{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--blush);color:var(--ink);border-radius:8px;padding:8px 14px;transition:background .3s,transform .3s}
.sm:hover{background:var(--line);transform:translateY(-2px)}
.abar{position:sticky;bottom:-26px;background:var(--bg);padding:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.logoprev{max-width:160px;display:block;margin-bottom:8px;background:#fff;border-radius:10px;padding:6px}

/* responsive */
@media(max-width:860px){.cgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.introg,.gl{grid-template-columns:1fr;gap:28px}}
@media(max-width:800px){.hero{padding:40px 0 56px}.hero-grid{grid-template-columns:1fr;gap:32px;justify-items:start}.plate{order:-1}.plate img{width:min(180px,50vw)}.hero-text>*,.plate{animation-name:slideUp}.plate{animation:slideUp 1s var(--ease) both,float 7s ease-in-out 1s infinite}section{padding:72px 0}.how li::after{display:none}}
@media(max-width:700px){
.dock{display:flex}
.nav .wrap{height:60px}.nav.scrolled .wrap{height:54px}.brand{font-size:30px}.nav ul{gap:14px;font-size:15px}.nav li.cta,.nav li.opt{display:none}
.facts .wrap{text-align:left}.facts .wrap>div{border-left:0;border-top:1px solid var(--line)}.facts .wrap>div:first-child{border-top:0}
.contact dl{grid-template-columns:1fr;gap:2px;padding:26px 24px}.contact dd{margin-bottom:14px}
.aopen{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.cart{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.services ul{grid-template-columns:repeat(2,1fr);gap:14px}.card h3{font-size:22px}.cb{padding:14px}.acts{flex-direction:column}
.social{top:auto;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:column-reverse}
.stab{width:42px;height:44px}.slinks a{width:42px;height:42px}
.mbody{padding:24px 22px 22px}.modal h3{font-size:34px}
}
@media(max-width:420px){.services ul{grid-template-columns:1fr}}
@media(max-width:380px){.nav ul{gap:10px;font-size:14px}}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
.rv{opacity:1;transform:none}
#mList li{opacity:1;transform:none}
.how li::after{transform:scaleX(1)}
}
.noanim .hero-text>*,.noanim .plate{animation:none}
.noanim #mList li{animation:none}

<style id="fx">
/* Motion layer: adds only. Palette variables, markup, data and API code untouched. */
.fxin{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.fxin i{position:absolute;inset:0;background:var(--rose);animation:wipe .9s cubic-bezier(.77,0,.18,1) 1.05s both}
.fxin i+i{background:var(--bronze);animation-delay:1.18s}
.fxin i:first-child{background:var(--bronze-d);animation-delay:1.3s}
.fxin b{position:relative;z-index:2;font:700 clamp(54px,13vw,128px)/1 var(--serif);color:#fff;animation:brandIn 1s var(--ease) both,fadeOut .4s ease 1.05s forwards}
.fxin small{position:absolute;z-index:2;bottom:12vh;font:500 12px var(--mono);letter-spacing:.4em;text-transform:uppercase;color:#fff;opacity:.85;animation:fadeOut .4s ease 1s forwards}
@keyframes wipe{to{transform:translateY(-101%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes brandIn{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.02em}}
.fxin i{animation-duration:.7s}
.fxin i:nth-of-type(1){animation-delay:1.5s}
.fxin i:nth-of-type(2),.fxin i:nth-of-type(3){animation-delay:1.4s}
html.intro .hero-text>*,html.intro .plate{animation-play-state:paused}
.fxglow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(196,164,132,.3),rgba(139,94,60,.1) 45%,transparent 70%);opacity:0;transition:opacity .6s}
