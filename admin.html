<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshhi Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; box-sizing: border-box; background-color: #fcfbfa; }
        .card { border: 1px solid #e2dcd5; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #fff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #4A3525; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 100px; }
        button { background: #4A3525; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5C4331; }
        .hidden { display: none; }
        .nav-links { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #4A3525; }
        .error { color: red; margin-top: 5px; font-size: 14px; }
        .success { color: green; margin-top: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="card">
        <h2>Arshhi Admin Login</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>
        <button onclick="login()">Log in</button>
        <p id="loginError" class="error"></p>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="adminPanel" class="hidden">
        <div class="nav-links">
            <strong>Arshhi Admin Portal</strong>
            <div>
                <a href="/" target="_blank" style="color: #4A3525; font-weight: bold;">View website</a> | 
                <a href="#" onclick="logout()" style="color: #666;">Log out</a>
            </div>
        </div>

        <!-- Dynamic Website Content Manager -->
        <div class="card">
            <h3>Edit Website Data</h3>
            <div class="form-group">
                <label>Main Headline Text</label>
                <input type="text" id="mainHeadline" placeholder="Arshhi – Door to door beauty care">
            </div>
            
            <h4 style="color: #4A3525; margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">Social Media Links</h4>
            <div class="form-group">
                <label>Facebook URL</label>
                <input type="text" id="linkFB" placeholder="https://facebook.com">
            </div>
            <div class="form-group">
                <label>Instagram URL</label>
                <input type="text" id="linkIG" placeholder="https://instagram.com">
            </div>
            <div class="form-group">
                <label>YouTube URL</label>
                <input type="text" id="linkYT" placeholder="https://youtube.com">
            </div>
            <div class="form-group">
                <label>LinkedIn URL</label>
                <input type="text" id="linkLN" placeholder="https://linkedin.com">
            </div>

            <button onclick="saveAllContent()">Save changes</button>
            <p id="contentStatus"></p>
        </div>

        <!-- Website Segments -->
        <div class="card">
            <h3>Website Segments</h3>
            <p style="font-size:14px;color:#666;margin-top:0">Add a new segment. It appears in the website navbar and as its own section with service cards (price, View details and Add button).</p>
            <button id="segOpenBtn" onclick="openSegForm()">+ Add segment</button>

            <div id="segForm" class="hidden" style="margin-top:20px;border-top:1px solid #eee;padding-top:15px">
                <div class="form-group">
                    <label>Navbar Name</label>
                    <input type="text" id="segNav" placeholder="e.g. Bridal">
                </div>
                <div class="form-group">
                    <label>Segment Heading</label>
                    <input type="text" id="segTitle" placeholder="e.g. Bridal packages at home">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="segDesc" placeholder="Short text shown under the heading"></textarea>
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;font-weight:normal">
                        <input type="checkbox" id="segShowNav" checked style="width:auto"> Show in navbar
                    </label>
                </div>
                <label>Services / items in this segment</label>
                <div id="segItems"></div>
                <button type="button" onclick="addSegItem()" style="background:#a67c52;margin-bottom:15px">+ Add item</button>
                <div>
                    <button onclick="saveSegment()" id="segSaveBtn">Save segment</button>
                    <button onclick="closeSegForm()" style="background:#888">Cancel</button>
                </div>
            </div>
            <p id="segStatus"></p>
            <div id="segList" style="margin-top:20px"></div>
        </div>

        <!-- Customer Feedback -->
        <div class="card">
            <h3>Customer Feedback</h3>
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="fbName" placeholder="e.g. Priya S.">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <select id="fbRating" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    <option value="5">5 stars</option>
                    <option value="4">4 stars</option>
                    <option value="3">3 stars</option>
                    <option value="2">2 stars</option>
                    <option value="1">1 star</option>
                </select>
            </div>
            <div class="form-group">
                <label>Feedback</label>
                <textarea id="fbText" placeholder="Customer's feedback"></textarea>
            </div>
            <button onclick="addFeedback()">Add feedback</button>
            <p id="fbStatus"></p>
            <div id="fbList" style="margin-top:20px"></div>
        </div>

        <!-- Change Password -->
        <div class="card">
            <h3>Change Password</h3>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currPass">
            </div>
            <div class="form-group">
                <label>New Password (at least 8 characters)</label>
                <input type="password" id="newPass">
            </div>
            <div class="form-group">
                <label>Repeat New Password</label>
                <input type="password" id="repeatPass">
            </div>
            <button onclick="changePassword()">Change password</button>
            <p id="passwordStatus"></p>
        </div>
    </div>

    <script>
        const tokenKey = 'arshhi_session_token';

        window.onload = async () => {
            if (localStorage.getItem(tokenKey)) {
                showAdminPanel();
            }
        };

        function showAdminPanel() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            fetchCurrentContent();
            loadFeedback();
            loadSegments();
        }

        function logout() {
            localStorage.removeItem(tokenKey);
            window.location.reload();
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.textContent = "";

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', username: u, password: p })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem(tokenKey, data.token);
                showAdminPanel();
            } else {
                err.textContent = data.error || "Login failed.";
            }
        }

        async function fetchCurrentContent() {
            const res = await fetch('/api/get-content');
            if (res.ok) {
                const data = await res.json();
                try {
                    const config = typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
                    document.getElementById('mainHeadline').value = config.headline || '';
                    document.getElementById('linkFB').value = config.facebook || '';
                    document.getElementById('linkIG').value = config.instagram || '';
                    document.getElementById('linkYT').value = config.youtube || '';
                    document.getElementById('linkLN').value = config.linkedin || '';
                } catch(e) {
                    // Fallback if data is raw string
                    document.getElementById('mainHeadline').value = data.content || '';
                }
            }
        }

        async function saveAllContent() {
            const status = document.getElementById('contentStatus');
            status.className = ''; status.textContent = 'Saving...';
            
            // Build the clean structured data object
            const existing = await getContent();
            const payload = Object.assign({}, existing, {
                headline: document.getElementById('mainHeadline').value,
                facebook: document.getElementById('linkFB').value,
                instagram: document.getElementById('linkIG').value,
                youtube: document.getElementById('linkYT').value,
                linkedin: document.getElementById('linkLN').value
            });

            const res = await fetch('/api/save-content', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem(tokenKey)}`
                },
                body: JSON.stringify({ content: JSON.stringify(payload) })
            });

            if (res.ok) {
                status.className = 'success';
                status.textContent = 'All changes and social links saved successfully!';
            } else {
                const data = await res.json();
                status.className = 'error';
                status.textContent = data.error || 'Failed to save.';
            }
        }

        async function getContent() {
            const res = await fetch('/api/get-content?cb=' + Date.now(), { cache: 'no-store' });
            const d = await res.json();
            let c = d.content;
            if (typeof c === 'string') { try { c = JSON.parse(c); } catch (e) { c = null; } }
            return (c && typeof c === 'object') ? c : {};
        }

        function saveContent(c) {
            return fetch('/api/save-content', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem(tokenKey)}`
                },
                body: JSON.stringify({ content: c })
            });
        }

        async function loadFeedback() {
            const box = document.getElementById('fbList');
            box.innerHTML = '';
            const c = await getContent();
            const list = Array.isArray(c.reviews) ? c.reviews : [];
            if (!list.length) { box.textContent = 'No feedback added yet.'; return; }
            list.forEach((r, i) => {
                const row = document.createElement('div');
                row.style.cssText = 'border:1px solid #e2dcd5;border-radius:6px;padding:10px;margin-bottom:10px;';
                const n = Math.max(1, Math.min(5, parseInt(r.r, 10) || 5));
                const t = document.createElement('div');
                t.innerHTML = '<b></b> <span style="color:#a67c52"></span>';
                t.querySelector('b').textContent = r.n || 'Customer';
                t.querySelector('span').textContent = '\u2605'.repeat(n) + '\u2606'.repeat(5 - n);
                const p = document.createElement('p');
                p.style.margin = '6px 0';
                p.textContent = r.c;
                const del = document.createElement('button');
                del.textContent = 'Delete';
                del.style.background = '#a33';
                del.onclick = () => deleteFeedback(i);
                row.append(t, p, del);
                box.appendChild(row);
            });
        }

        async function addFeedback() {
            const status = document.getElementById('fbStatus');
            const name = document.getElementById('fbName').value.trim();
            const rating = parseInt(document.getElementById('fbRating').value, 10);
            const text = document.getElementById('fbText').value.trim();
            if (!text) { status.className = 'error'; status.textContent = 'Please write the feedback.'; return; }
            status.className = ''; status.textContent = 'Saving...';
            const c = await getContent();
            c.reviews = Array.isArray(c.reviews) ? c.reviews : [];
            c.reviews.push({ n: name || 'Customer', r: rating, c: text });
            const res = await saveContent(c);
            if (res.ok) {
                status.className = 'success'; status.textContent = 'Feedback added.';
                document.getElementById('fbName').value = '';
                document.getElementById('fbText').value = '';
                loadFeedback();
            } else {
                const d = await res.json();
                status.className = 'error'; status.textContent = d.error || 'Failed to save.';
            }
        }

        async function deleteFeedback(i) {
            if (!confirm('Delete this feedback?')) return;
            const c = await getContent();
            c.reviews = (c.reviews || []).filter((_, idx) => idx !== i);
            const res = await saveContent(c);
            if (res.ok) loadFeedback();
        }

        /* ---------- Website Segments ---------- */
        let segEditIndex = -1;

        function openSegForm() {
            resetSegForm();
            document.getElementById('segForm').classList.remove('hidden');
            document.getElementById('segOpenBtn').classList.add('hidden');
            addSegItem();
        }

        function closeSegForm() {
            resetSegForm();
            document.getElementById('segForm').classList.add('hidden');
            document.getElementById('segOpenBtn').classList.remove('hidden');
        }

        function addSegItem(it) {
            it = it || {};
            const box = document.getElementById('segItems');
            const row = document.createElement('div');
            row.className = 'seg-item';
            row.style.cssText = 'border:1px solid #e2dcd5;border-radius:6px;padding:10px;margin-bottom:10px;background:#fcfbfa;';
            row.innerHTML =
                '<input type="text" class="si-t" placeholder="Item name" style="margin-bottom:8px">' +
                '<input type="text" class="si-c" placeholder="Category tag (optional)" style="margin-bottom:8px">' +
                '<input type="text" class="si-p" placeholder="Price in rupees (optional), e.g. 499" style="margin-bottom:8px">' +
                '<input type="text" class="si-s" placeholder="Short summary shown on the card" style="margin-bottom:8px">' +
                '<textarea class="si-d" placeholder="Full details shown in View details" style="height:70px;margin-bottom:8px"></textarea>' +
                '<textarea class="si-l" placeholder="What is included (one point per line)" style="height:70px;margin-bottom:8px"></textarea>';
            row.querySelector('.si-t').value = it.t || '';
            row.querySelector('.si-c').value = it.c || '';
            row.querySelector('.si-p').value = it.p || '';
            row.querySelector('.si-s').value = it.s || '';
            row.querySelector('.si-d').value = it.d || '';
            row.querySelector('.si-l').value = Array.isArray(it.l) ? it.l.join('\n') : '';
            const rm = document.createElement('button');
            rm.type = 'button';
            rm.textContent = 'Remove item';
            rm.style.background = '#a33';
            rm.onclick = () => row.remove();
            row.appendChild(rm);
            box.appendChild(row);
        }

        function resetSegForm() {
            segEditIndex = -1;
            document.getElementById('segNav').value = '';
            document.getElementById('segTitle').value = '';
            document.getElementById('segDesc').value = '';
            document.getElementById('segShowNav').checked = true;
            document.getElementById('segItems').innerHTML = '';
            document.getElementById('segSaveBtn').textContent = 'Save segment';
        }

        function segSlug(text, taken) {
            const base = 'seg-' + (String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'new');
            let id = base, n = 2;
            while (taken.indexOf(id) >= 0) id = base + '-' + (n++);
            return id;
        }

        async function saveSegment() {
            const status = document.getElementById('segStatus');
            const nav = document.getElementById('segNav').value.trim();
            const title = document.getElementById('segTitle').value.trim();
            const desc = document.getElementById('segDesc').value.trim();
            const showNav = document.getElementById('segShowNav').checked;
            if (!nav && !title) { status.className = 'error'; status.textContent = 'Please enter a navbar name or heading.'; return; }

            const items = [];
            document.querySelectorAll('#segItems .seg-item').forEach(r => {
                const t = r.querySelector('.si-t').value.trim();
                const c = r.querySelector('.si-c').value.trim();
                const p = r.querySelector('.si-p').value.trim();
                const s = r.querySelector('.si-s').value.trim();
                const d = r.querySelector('.si-d').value.trim();
                const l = r.querySelector('.si-l').value.split('\n').map(x => x.trim()).filter(Boolean);
                if (t || s || d) items.push({ t, c, p, s, d, l });
            });

            status.className = ''; status.textContent = 'Saving...';
            const c = await getContent();
            c.customSections = Array.isArray(c.customSections) ? c.customSections : [];

            if (segEditIndex >= 0 && c.customSections[segEditIndex]) {
                const old = c.customSections[segEditIndex];
                c.customSections[segEditIndex] = Object.assign({}, old, { n: nav || title, t: title || nav, d: desc, nav: showNav, items });
            } else {
                const taken = c.customSections.map(x => x.id);
                c.customSections.push({ id: segSlug(nav || title, taken), n: nav || title, t: title || nav, d: desc, nav: showNav, items });
            }

            const res = await saveContent(c);
            if (res.ok) {
                status.className = 'success';
                status.textContent = 'Segment saved. It is now on your website and navbar.';
                closeSegForm();
                loadSegments();
            } else {
                let d = {}; try { d = await res.json(); } catch (e) {}
                status.className = 'error'; status.textContent = d.error || 'Failed to save.';
            }
        }

        async function loadSegments() {
            const box = document.getElementById('segList');
            box.innerHTML = '';
            const c = await getContent();
            const list = Array.isArray(c.customSections) ? c.customSections : [];
            if (!list.length) { box.textContent = 'No segments added yet.'; return; }
            list.forEach((sg, i) => {
                const row = document.createElement('div');
                row.style.cssText = 'border:1px solid #e2dcd5;border-radius:6px;padding:10px;margin-bottom:10px;';
                const t = document.createElement('div');
                t.innerHTML = '<b></b> <small style="color:#888"></small>';
                t.querySelector('b').textContent = sg.n || sg.t;
                t.querySelector('small').textContent = ' (' + ((sg.items || []).length) + ' items' + (sg.nav === false ? ', hidden from navbar' : '') + ')';
                const edit = document.createElement('button');
                edit.textContent = 'Edit';
                edit.style.cssText = 'margin-top:8px;margin-right:8px;';
                edit.onclick = () => editSegment(i, sg);
                const del = document.createElement('button');
                del.textContent = 'Delete';
                del.style.cssText = 'margin-top:8px;background:#a33;';
                del.onclick = () => deleteSegment(i);
                row.append(t, edit, del);
                box.appendChild(row);
            });
        }

        function editSegment(i, sg) {
            openSegForm();
            document.getElementById('segItems').innerHTML = '';
            segEditIndex = i;
            document.getElementById('segNav').value = sg.n || '';
            document.getElementById('segTitle').value = sg.t || '';
            document.getElementById('segDesc').value = sg.d || '';
            document.getElementById('segShowNav').checked = sg.nav !== false;
            (sg.items || []).forEach(x => addSegItem({ t: x.t, c: x.c, p: x.p, s: x.s || x.d, d: x.d, l: x.l }));
            document.getElementById('segSaveBtn').textContent = 'Update segment';
            document.getElementById('segNav').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function deleteSegment(i) {
            if (!confirm('Delete this segment from the website?')) return;
            const c = await getContent();
            c.customSections = (c.customSections || []).filter((_, idx) => idx !== i);
            const res = await saveContent(c);
            if (res.ok) { closeSegForm(); loadSegments(); }
        }

        async function changePassword() {
            const status = document.getElementById('passwordStatus');
            status.className = ''; status.textContent = '';
            const current = document.getElementById('currPass').value;
            const newP = document.getElementById('newPass').value;
            const repeat = document.getElementById('repeatPass').value;

            if (newP !== repeat) {
                status.className = 'error';
                status.textContent = "New passwords don't match.";
                return;
            }

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem(tokenKey)}`
                },
                body: JSON.stringify({ action: 'changePassword', currentPassword: current, newPassword: newP })
            });

            if (res.ok) {
                status.className = 'success';
                status.textContent = 'Password updated! Logging out...';
                setTimeout(logout, 2000);
            } else {
                const data = await res.json();
                status.className = 'error';
                status.textContent = data.error || 'Update failed.';
            }
        }
    </script>
</body>
</html>
